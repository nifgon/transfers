<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Переводы">
<meta name="theme-color" content="#1a1a2e">
<title>Переводы</title>
<link rel="manifest" href="manifest.json">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg: #0f0f1a;
    --card: #1a1a2e;
    --accent: #7c6aff;
    --accent2: #ff6a9b;
    --text: #f0f0ff;
    --muted: #8888aa;
    --border: #2a2a44;
    --green: #4ade80;
    --red: #f87171;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
  }

  /* TABS */
  .tabs {
    display: flex;
    background: var(--card);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .tab {
    flex: 1;
    padding: 14px 8px;
    text-align: center;
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all .2s;
    letter-spacing: .3px;
  }
  .tab.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }

  /* PAGES */
  .page { display: none; flex: 1; flex-direction: column; padding: 20px 16px; gap: 16px; }
  .page.active { display: flex; }

  /* ADD PAGE */
  .amount-row {
    display: flex;
    align-items: center;
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 16px;
    padding: 16px 20px;
    gap: 10px;
    transition: border-color .2s;
  }
  .amount-row:focus-within { border-color: var(--accent); }
  .currency {
    font-size: 28px;
    font-weight: 700;
    color: var(--accent);
    min-width: 28px;
  }
  #amount {
    flex: 1;
    background: none;
    border: none;
    outline: none;
    font-size: 36px;
    font-weight: 700;
    color: var(--text);
    width: 100%;
    caret-color: var(--accent);
  }
  #amount::placeholder { color: var(--border); }

  .note-row {
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 16px;
    padding: 16px 20px;
    transition: border-color .2s;
  }
  .note-row:focus-within { border-color: var(--accent); }
  .note-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 6px;
  }
  #note {
    width: 100%;
    background: none;
    border: none;
    outline: none;
    font-size: 17px;
    color: var(--text);
    caret-color: var(--accent);
  }
  #note::placeholder { color: var(--muted); }

  /* QUICK TAGS */
  .tags {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .tag {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 7px 14px;
    font-size: 13px;
    color: var(--muted);
    cursor: pointer;
    transition: all .15s;
    user-select: none;
  }
  .tag:active, .tag.selected {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  .btn-add {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 16px;
    padding: 18px;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    width: 100%;
    letter-spacing: .5px;
    transition: opacity .15s, transform .1s;
    margin-top: auto;
  }
  .btn-add:active { opacity: .85; transform: scale(.98); }

  .toast {
    position: fixed;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--green);
    color: #000;
    padding: 12px 24px;
    border-radius: 24px;
    font-weight: 700;
    font-size: 15px;
    transition: transform .3s cubic-bezier(.34,1.56,.64,1);
    z-index: 100;
    pointer-events: none;
    white-space: nowrap;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  /* HISTORY PAGE */
  .month-picker {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--card);
    border-radius: 12px;
    padding: 10px 16px;
  }
  .month-nav {
    background: none;
    border: none;
    color: var(--accent);
    font-size: 22px;
    cursor: pointer;
    padding: 4px 10px;
    border-radius: 8px;
    transition: background .15s;
  }
  .month-nav:active { background: var(--border); }
  .month-title { font-weight: 700; font-size: 16px; }

  .summary-cards {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .s-card {
    background: var(--card);
    border-radius: 14px;
    padding: 14px;
    border: 1px solid var(--border);
  }
  .s-card .label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .8px; margin-bottom: 4px; }
  .s-card .value { font-size: 22px; font-weight: 700; }
  .s-card .value.green { color: var(--green); }
  .s-card .value.accent { color: var(--accent); }

  .entries-list { display: flex; flex-direction: column; gap: 8px; flex: 1; overflow-y: auto; }

  .entry {
    display: flex;
    align-items: center;
    background: var(--card);
    border-radius: 14px;
    padding: 14px 16px;
    gap: 12px;
    border: 1px solid var(--border);
    position: relative;
  }
  .entry-info { flex: 1; min-width: 0; }
  .entry-note { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .entry-date { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .entry-amount { font-size: 18px; font-weight: 700; color: var(--accent2); white-space: nowrap; }
  .entry-del {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 18px;
    cursor: pointer;
    padding: 4px 6px;
    border-radius: 8px;
    transition: color .15s;
  }
  .entry-del:active { color: var(--red); }

  .empty { text-align: center; color: var(--muted); padding: 40px 0; font-size: 15px; }

  /* STATS PAGE */
  .cat-list { display: flex; flex-direction: column; gap: 8px; }
  .cat-item {
    background: var(--card);
    border-radius: 14px;
    padding: 14px 16px;
    border: 1px solid var(--border);
  }
  .cat-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .cat-name { font-weight: 600; font-size: 15px; }
  .cat-total { font-weight: 700; font-size: 16px; color: var(--accent2); }
  .bar-bg { background: var(--border); border-radius: 4px; height: 6px; }
  .bar-fill { background: var(--accent); height: 6px; border-radius: 4px; transition: width .4s; }

  .export-btn {
    background: var(--card);
    border: 1.5px solid var(--border);
    color: var(--muted);
    border-radius: 12px;
    padding: 12px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: border-color .2s, color .2s;
  }
  .export-btn:active { border-color: var(--accent); color: var(--accent); }
</style>
</head>
<body>

<div class="tabs">
  <div class="tab active" onclick="showPage('add')">+ Добавить</div>
  <div class="tab" onclick="showPage('history')">История</div>
  <div class="tab" onclick="showPage('stats')">Итоги</div>
</div>

<!-- ADD PAGE -->
<div class="page active" id="page-add">
  <div class="amount-row">
    <div class="currency">₽</div>
    <input id="amount" type="number" inputmode="decimal" placeholder="0" autocomplete="off">
  </div>

  <div class="note-row">
    <div class="note-label">Куда / за что</div>
    <input id="note" type="text" placeholder="Например: кофе, такси, аренда..." autocomplete="off" maxlength="80">
  </div>

  <div class="tags" id="quick-tags">
    <div class="tag" onclick="setTag(this, 'Еда')">🍕 Еда</div>
    <div class="tag" onclick="setTag(this, 'Транспорт')">🚕 Транспорт</div>
    <div class="tag" onclick="setTag(this, 'Кофе')">☕ Кофе</div>
    <div class="tag" onclick="setTag(this, 'Продукты')">🛒 Продукты</div>
    <div class="tag" onclick="setTag(this, 'Аренда')">🏠 Аренда</div>
    <div class="tag" onclick="setTag(this, 'Связь')">📱 Связь</div>
    <div class="tag" onclick="setTag(this, 'Развлечения')">🎬 Развлечения</div>
    <div class="tag" onclick="setTag(this, 'Здоровье')">💊 Здоровье</div>
  </div>

  <button class="btn-add" onclick="addEntry()">✓ Записать</button>
</div>

<!-- HISTORY PAGE -->
<div class="page" id="page-history">
  <div class="month-picker">
    <button class="month-nav" onclick="changeMonth(-1)">‹</button>
    <div class="month-title" id="month-title"></div>
    <button class="month-nav" onclick="changeMonth(1)">›</button>
  </div>

  <div class="summary-cards">
    <div class="s-card">
      <div class="label">Итого</div>
      <div class="value green" id="month-total">0 ₽</div>
    </div>
    <div class="s-card">
      <div class="label">Операций</div>
      <div class="value accent" id="month-count">0</div>
    </div>
  </div>

  <div class="entries-list" id="entries-list"></div>
</div>

<!-- STATS PAGE -->
<div class="page" id="page-stats">
  <div class="month-picker">
    <button class="month-nav" onclick="changeMonth(-1); renderStats()">‹</button>
    <div class="month-title" id="stats-month-title"></div>
    <button class="month-nav" onclick="changeMonth(1); renderStats()">›</button>
  </div>

  <div class="cat-list" id="cat-list"></div>

  <button class="export-btn" onclick="exportCSV()">⬇ Экспорт CSV</button>
</div>

<div class="toast" id="toast">Записано!</div>

<script>
const MONTHS_RU = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
let currentYear = new Date().getFullYear();
let currentMonth = new Date().getMonth();

function getData() { return JSON.parse(localStorage.getItem('transfers') || '[]'); }
function saveData(d) { localStorage.setItem('transfers', JSON.stringify(d)); }

function monthKey(y, m) { return `${y}-${String(m+1).padStart(2,'0')}`; }
function getMonthEntries(y, m) {
  const key = monthKey(y, m);
  return getData().filter(e => e.date.startsWith(key));
}

function showPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  const idx = ['add','history','stats'].indexOf(name);
  document.querySelectorAll('.tab')[idx].classList.add('active');
  if (name === 'history') renderHistory();
  if (name === 'stats') renderStats();
}

function setTag(el, text) {
  document.querySelectorAll('.tag').forEach(t => t.classList.remove('selected'));
  const noteEl = document.getElementById('note');
  if (noteEl.value === text) {
    noteEl.value = '';
  } else {
    el.classList.add('selected');
    noteEl.value = text;
    noteEl.focus();
  }
}

function addEntry() {
  const amount = parseFloat(document.getElementById('amount').value);
  const note = document.getElementById('note').value.trim();
  if (!amount || amount <= 0) { document.getElementById('amount').focus(); return; }
  if (!note) { document.getElementById('note').focus(); return; }

  const now = new Date();
  const entry = {
    id: Date.now(),
    amount,
    note,
    date: now.toISOString().slice(0,10)
  };
  const data = getData();
  data.unshift(entry);
  saveData(data);

  document.getElementById('amount').value = '';
  document.getElementById('note').value = '';
  document.querySelectorAll('.tag').forEach(t => t.classList.remove('selected'));

  const toast = document.getElementById('toast');
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 1800);

  if (navigator.vibrate) navigator.vibrate(40);
}

function changeMonth(dir) {
  currentMonth += dir;
  if (currentMonth < 0) { currentMonth = 11; currentYear--; }
  if (currentMonth > 11) { currentMonth = 0; currentYear++; }
  renderHistory();
  renderStats();
}

function fmtDate(iso) {
  const [y,m,d] = iso.split('-');
  return `${d}.${m}.${y}`;
}

function fmtAmount(n) {
  return n.toLocaleString('ru-RU') + ' ₽';
}

function renderHistory() {
  const title = `${MONTHS_RU[currentMonth]} ${currentYear}`;
  document.getElementById('month-title').textContent = title;

  const entries = getMonthEntries(currentYear, currentMonth);
  const total = entries.reduce((s, e) => s + e.amount, 0);

  document.getElementById('month-total').textContent = fmtAmount(total);
  document.getElementById('month-count').textContent = entries.length;

  const list = document.getElementById('entries-list');
  if (entries.length === 0) {
    list.innerHTML = '<div class="empty">Нет записей за этот месяц</div>';
    return;
  }
  list.innerHTML = entries.map(e => `
    <div class="entry" id="e${e.id}">
      <div class="entry-info">
        <div class="entry-note">${escHtml(e.note)}</div>
        <div class="entry-date">${fmtDate(e.date)}</div>
      </div>
      <div class="entry-amount">${fmtAmount(e.amount)}</div>
      <button class="entry-del" onclick="delEntry(${e.id})">✕</button>
    </div>
  `).join('');
}

function delEntry(id) {
  const data = getData().filter(e => e.id !== id);
  saveData(data);
  renderHistory();
}

function renderStats() {
  const title = `${MONTHS_RU[currentMonth]} ${currentYear}`;
  document.getElementById('stats-month-title').textContent = title;

  const entries = getMonthEntries(currentYear, currentMonth);
  const cats = {};
  entries.forEach(e => {
    cats[e.note] = (cats[e.note] || 0) + e.amount;
  });

  const sorted = Object.entries(cats).sort((a,b) => b[1]-a[1]);
  const max = sorted[0]?.[1] || 1;

  const list = document.getElementById('cat-list');
  if (sorted.length === 0) {
    list.innerHTML = '<div class="empty">Нет данных</div>';
    return;
  }
  list.innerHTML = sorted.map(([name, total]) => `
    <div class="cat-item">
      <div class="cat-header">
        <div class="cat-name">${escHtml(name)}</div>
        <div class="cat-total">${fmtAmount(total)}</div>
      </div>
      <div class="bar-bg"><div class="bar-fill" style="width:${(total/max*100).toFixed(1)}%"></div></div>
    </div>
  `).join('');
}

function exportCSV() {
  const entries = getMonthEntries(currentYear, currentMonth);
  if (!entries.length) { alert('Нет данных за этот месяц'); return; }
  const rows = [['Дата','Примечание','Сумма']];
  entries.forEach(e => rows.push([e.date, `"${e.note.replace(/"/g,'""')}"`, e.amount]));
  const csv = '﻿' + rows.map(r => r.join(';')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'}));
  a.download = `переводы_${monthKey(currentYear,currentMonth)}.csv`;
  a.click();
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Enter key support
document.getElementById('amount').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('note').focus();
});
document.getElementById('note').addEventListener('keydown', e => {
  if (e.key === 'Enter') addEntry();
});

// Init
renderHistory();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}
</script>
</body>
</html>
